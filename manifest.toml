# agdevworld settings manifest (ag.settings-manifest.v1).
#
# What the Front Desk and the agents read to know who the characters are and
# what a room looks like. Paths are relative to this repository's root.
# Adding a character is a new `[characters.<id>]` table plus its files;
# nothing in agdevworld or agfront has to change.

schema = "ag.settings-manifest.v1"

[characters.front]
name = "Front"
nickname = "姐さん"
lore = "characters/front/lore.md"
face = "characters/front/face.jpg"
# Which agents speak as this character: the `agent` name every instance
# declares in its `#agents` introduction (`front-agstudio1` is agent `front`).
agents = ["front"]

[characters.autolab]
name = "Autolab"
nickname = "親方"
lore = "characters/autolab/lore.md"
face = "characters/autolab/face.jpg"
agents = ["autolab"]

[rooms.front]
name = "Front Desk"
background = "rooms/front/bg.png"

# The Arguing Room (argue p2): where a human leads an argue with every agent.
[rooms.argue]
name = "Arguing Room"
background = "rooms/argue/bg.png"

[characters.forge]
name = "Forge"
nickname = "ピーちゃん"
lore = "characters/forge/lore.md"
face = "characters/forge/face.jpg"
# `agforge-agstudio1` introduces itself in `#agents` as agent `agforge`.
agents = ["agforge"]

# The knowledge council. `archsage-agstudio1` introduces itself as agent
# `archsage`; this is the council's own voice. A sage (`sage:<name>`) is a
# different speaker on the same account and is *not* this character: it is
# shown under its own label unless a character lists it in `senders`.
[characters.archsage]
name = "Archsage"
nickname = "ターくん"
lore = "characters/archsage/lore.md"
face = "characters/archsage/face.png"
agents = ["archsage"]
